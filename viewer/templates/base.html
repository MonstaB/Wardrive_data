<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 20px 30px;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
    }

    nav {
        margin-top: 10px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-right: 20px;
    }

    nav a:hover {
        text-decoration: underline;
    }

    main {
    width: 100%;
    margin: 30px 0;
    padding: 0 30px;
    }

    .stats {
    display: flex;
    gap: 20px;
    width: 100%;
    }

    .stat {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .stat h2 {
        margin: 0 0 10px 0;
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
    }

    .stat p {
        margin: 0;
        font-size: 32px;
        font-weight: bold;
    }

    .card {
        background: white;
        padding: 20px;
        margin-bottom: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    table {
        text-align: left;
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 1px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background: #f1f3f5;
    }

    tr:hover {
        background: #f8f9fa;
    }

    a {
        color: #0066cc;
    }
</style>


</head>

<body>

<header>
    <h1><nav>Wardrive Viewer  .<a href="/">Dashboard</a></nav></h1>





</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
